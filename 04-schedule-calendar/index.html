<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정 대시보드 | 공공주거 길잡이</title>
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="calendar.css">
</head>
<body>
<div class="layout">
<aside class="gnb">
<div class="gnb-brand"><strong>청년주거트래커</strong><span>공공주거 길잡이</span></div>
<nav class="gnb-nav">
<a href="../04-schedule-calendar/index.html" aria-current="page">일정 대시보드</a>
<a href="../05-housing-tracker/index.html">내 공고</a>
<a href="../02-self-diagnosis/index.html">자가진단</a>
</nav>
<a class="gnb-add" href="../03-notice-summary/index.html">+ 공고 추가</a>
</aside>

<main class="layout-main cal-main">
<div class="cal-wrap">

<div class="cal-top">
<div class="cal-month">
<h1 id="monthTitle">2026년 11월</h1>
<button type="button" class="icon-btn" id="prevMonth" aria-label="이전 달"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
<button type="button" class="pill-btn" id="todayBtn">오늘</button>
<button type="button" class="icon-btn" id="nextMonth" aria-label="다음 달"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
</div>
<div class="legend" id="legend" role="group" aria-label="일정 유형 필터"></div>
</div>

<div class="filter-bar">
<div class="filter-group" role="group" aria-label="공급 기관 필터">
<span class="filter-label">공급 기관</span>
<div id="orgFilter" class="filter-chips"></div>
</div>
<div class="filter-group">
<span class="filter-hint">☆를 누르면 내 캘린더에 등록됩니다</span>
<button type="button" class="star-only" id="starOnly" aria-pressed="false"><span aria-hidden="true">★</span>등록한 공고만</button>
</div>
</div>

<div class="cal-body">
<section class="cal-grid-wrap" aria-label="월간 캘린더">
<div class="cal-grid">
<div class="cal-week"><span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="cal-days" id="days"></div>
</div>
</section>

<div class="cal-side">
<section class="summary" id="summary" aria-label="공고 요약" hidden></section>

<section class="day-panel">
<div class="day-head"><h2 id="dayTitle"></h2><span id="dayCount"></span></div>
<div id="dayList"></div>
</section>

<section class="todo" id="todo" aria-label="지금 챙길 공고"></section>
</div>
</div>

<p class="source" id="source"></p>
</div>
</main>
</div>

<script src="../shared/sample-data.js"></script>
<script src="calendar.js"></script>
</body>
</html>
